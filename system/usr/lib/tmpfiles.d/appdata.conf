# Application data directories.
#
# Every hostPath volume in this repo uses `type: Directory`, which makes the
# kubelet refuse to create anything — the path must already exist or the pod
# hangs in ContainerCreating. systemd-tmpfiles runs after local-fs.target on
# every boot, so this both seeds a bare /var and repairs ownership drift.
#
# Ownership matches the uid each image runs as. Getting one wrong shows up as
# a permission error in that pod's logs, not as a mount failure.

d /var/data                       0755 root  root  - -
d /var/data/local                 0755 root  root  - -

# apps
d /var/data/local/vaultwarden     0700 root  root  - -
d /var/data/local/actual          0755 1000  1000  - -
d /var/data/local/siyuan          0755 1001  1002  - -
d /var/data/local/home-assistant  0755 root  root  - -
d /var/data/local/immich          0755 root  root  - -
# Postgres refuses to start unless its data directory is 0700 and owned by it.
d /var/data/local/immich/db       0700 999   999   - -

# monitoring
d /var/data/local/grafana         0755 472   472   - -
d /var/data/local/prometheus      0755 65534 65534 - -
d /var/data/local/loki            0755 10001 10001 - -
d /var/data/local/alloy           0755 root  root  - -

# Deliberately NOT creating anything under /var/data/external.
#
# That path is a mount point for the USB SSD, and local-fs.target only *wants*
# the mount, so boot continues when the disk is absent. If tmpfiles created
# these directories they would land on the root filesystem, `type: Directory`
# would then succeed, and immich would silently write your photo library to the
# internal NVMe instead of failing loudly.
#
# These live on the external disk itself and persist there. The correct guard
# is RequiresMountsFor=/var/data/external in k3s.service.
#
#   /var/data/external/immich/library
#   /var/data/external/immich/machine-learning
