apiVersion: v1
kind: Secret
metadata:
    name: flux-gpg-public-keys
    namespace: flux-system
type: Opaque
stringData:
    wacky.asc: |
        -----BEGIN PGP PUBLIC KEY BLOCK-----
        mDMEapgrChYJKwYBBAHaRw8BAQdAqGmkLyuty9g/q89otIZ4EjHXKg2d01Xn5h3b
        +VB3Ke60BXdhY2t5iJMEExYKADsWIQTOCSuUj9Xe4p1xJFBhfNGfa5xdLwUCapgr
        CgIbAwULCQgHAgIiAgYVCgkICwIEFgIDAQIeBwIXgAAKCRBhfNGfa5xdLxX9AP4k
        sB/WNixoPAS0dsqQpqrk2IQigtJMhB+jVzqx4OICHgEAmmgij9ZDovS+Jm4bz/5W
        hJYWtcVnD++fUZv1tSy0qws=
        =z6RS
        -----END PGP PUBLIC KEY BLOCK-----
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
    name: flux-system
    namespace: flux-system
spec:
    interval: 1m
    url: https://github.com/wacky-homes/server.git
    ref:
        branch: main
    verify:
        mode: HEAD
        secretRef:
            name: flux-gpg-public-keys
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
    name: applications
    namespace: flux-system
spec:
    interval: 5m
    path: ./apps
    prune: true
    wait: true
    timeout: 5m
    sourceRef:
        kind: GitRepository
        name: flux-system
    decryption:
        provider: sops
        secretRef:
            name: sops-age
