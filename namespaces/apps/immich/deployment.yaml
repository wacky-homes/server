apiVersion: apps/v1
kind: Deployment

metadata:
    name: immich

spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app: immich
    template:
        metadata:
            labels:
                app: immich
        spec:
            enableServiceLinks: false
            containers:
                - name: immich-db
                  image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0@sha256:1a078b237c1d9b420b0ee59147386b4aa60d3a07a8e6a402fc84a57e41b043a4
                  env:
                      - name: POSTGRES_DB
                        value: immich
                      - name: POSTGRES_USER
                        value: postgres
                  envFrom:
                      - secretRef:
                            name: immich
                  volumeMounts:
                      - name: immich-db
                        mountPath: /var/lib/postgresql/data
                  resources:
                      requests:
                          cpu: 100m
                          memory: 256Mi
                      limits:
                          memory: 1Gi
                  startupProbe:
                      exec:
                          command:
                              ["pg_isready", "-U", "postgres", "-d", "immich"]
                      periodSeconds: 2
                      failureThreshold: 60

                - name: immich-redis
                  image: docker.io/valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
                  resources:
                      requests:
                          cpu: 50m
                          memory: 64Mi
                      limits:
                          memory: 256Mi
                  startupProbe:
                      exec:
                          command: ["valkey-cli", "ping"]
                      periodSeconds: 2
                      failureThreshold: 30

                - name: immich
                  image: ghcr.io/immich-app/immich-server:v3.3.1@sha256:db996e352359771c6a3db121a0ed8761516b22f727fc092a0f46dcfef82c1bc1
                  env:
                      - name: UPLOAD_LOCATION
                        value: /data/immich/library
                      - name: DB_DATA_LOCATION
                        value: /data/immich/db
                      - name: DB_HOSTNAME
                        value: localhost
                      - name: DB_DATABASE_NAME
                        value: immich
                      - name: DB_USERNAME
                        value: postgres
                      - name: REDIS_HOSTNAME
                        value: localhost
                      - name: IMMICH_MACHINE_LEARNING_URL
                        value: http://localhost:3003

                  envFrom:
                      - secretRef:
                            name: immich
                  ports:
                      - name: http
                        containerPort: 2283
                  resources:
                      requests:
                          cpu: 200m
                          memory: 512Mi
                      limits:
                          memory: 2Gi
                  volumeMounts:
                      - name: immich-library
                        mountPath: /data

                - name: immich-machine-learning
                  image: ghcr.io/immich-app/immich-machine-learning:v3.3.1@sha256:513c831cfb010ad319341a0c86b42c575a0d5b688d3e8cae346ee624074a58ed
                  env:
                      - name: UPLOAD_LOCATION
                        value: /data/immich/library
                      - name: DB_DATA_LOCATION
                        value: /data/immich/db
                  resources:
                      requests:
                          cpu: 200m
                          memory: 1Gi
                      limits:
                          memory: 4Gi
                  volumeMounts:
                      - name: immich-machine-learning
                        mountPath: /cache
            volumes:
                - name: immich-db
                  hostPath:
                      path: /var/data/local/immich/db
                      type: Directory
                - name: immich-library
                  hostPath:
                      path: /var/data/external/immich/library
                      type: Directory
                - name: immich-machine-learning
                  hostPath:
                      path: /var/data/external/immich/machine-learning
                      type: Directory
