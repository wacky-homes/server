apiVersion: apps/v1
kind: Deployment

metadata:
    name: cloudflared

spec:
    replicas: 1
    selector:
        matchLabels:
            app: cloudflared
    template:
        metadata:
            labels:
                app: cloudflared
        spec:
            enableServiceLinks: false
            containers:
                - name: cloudflared
                  image: docker.io/cloudflare/cloudflared:latest@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
                  args:
                      - tunnel
                      - --no-autoupdate
                      - --metrics
                      - 0.0.0.0:2000
                      - run
                  envFrom:
                      - secretRef:
                            name: cloudflared
                  resources:
                      requests:
                          cpu: 50m
                          memory: 64Mi
                      limits:
                          memory: 256Mi
                  readinessProbe:
                      httpGet:
                          path: /ready
                          port: 2000
                      initialDelaySeconds: 5
                      periodSeconds: 10
