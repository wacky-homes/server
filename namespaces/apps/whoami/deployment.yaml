apiVersion: apps/v1
kind: Deployment

metadata:
    name: whoami

spec:
    replicas: 3
    selector:
        matchLabels:
            app: whoami
    template:
        metadata:
            labels:
                app: whoami
        spec:
            enableServiceLinks: false
            containers:
                - name: whoami
                  image: docker.io/traefik/whoami:v1.12@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
                  ports:
                      - name: http
                        containerPort: 80
                  resources:
                      requests:
                          cpu: 10m
                          memory: 16Mi
                      limits:
                          memory: 64Mi
