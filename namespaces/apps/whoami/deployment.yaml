apiVersion: apps/v1
kind: Deployment

metadata:
    name: whoami

spec:
    replicas: 3
    selector:
        matchLabels:
            app: whoami
    template:
        metadata:
            labels:
                app: whoami
        spec:
            enableServiceLinks: false
            containers:
                - name: whoami
                  image: traefik/whoami:v1.10
                  ports:
                      - name: http
                        containerPort: 80
                  resources:
                      requests:
                          cpu: 10m
                          memory: 16Mi
                      limits:
                          memory: 64Mi
