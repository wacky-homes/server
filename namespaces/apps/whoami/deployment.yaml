apiVersion: apps/v1
kind: Deployment

metadata:
    name: whoami

spec:
    replicas: 3
    selector:
        matchLabels:
            app: whoami
    template:
        metadata:
            labels:
                app: whoami
        spec:
            enableServiceLinks: false
            containers:
                - name: whoami
                  image: docker.io/traefik/whoami:v1.10@sha256:1699d99cb4b9acc17f74ca670b3d8d0b7ba27c948b3445f0593b58ebece92f04
                  ports:
                      - name: http
                        containerPort: 80
                  resources:
                      requests:
                          cpu: 10m
                          memory: 16Mi
                      limits:
                          memory: 64Mi
