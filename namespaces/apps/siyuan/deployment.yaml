apiVersion: apps/v1
kind: Deployment

metadata:
    name: siyuan

spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app: siyuan
    template:
        metadata:
            labels:
                app: siyuan
        spec:
            enableServiceLinks: false
            containers:
                - name: siyuan
                  image: docker.io/b3log/siyuan:latest@sha256:af1442205fd60a8f5710c46c7e4c92bf3c8c1c9405026823496e4459f821549c
                  args:
                      - serve
                      - --workspace=/data
                  env:
                      - name: SIYUAN_OIDC_ENABLED
                        value: "false"
                      - name: PUID
                        value: "1001"
                      - name: PGID
                        value: "1002"
                  envFrom:
                      - secretRef:
                            name: siyuan
                  ports:
                      - name: http
                        containerPort: 6806
                  resources:
                      requests:
                          cpu: 100m
                          memory: 256Mi
                      limits:
                          memory: 1Gi
                  volumeMounts:
                      - name: siyuan
                        mountPath: /data
            volumes:
                - name: siyuan
                  hostPath:
                      path: /var/data/local/siyuan
                      type: Directory
