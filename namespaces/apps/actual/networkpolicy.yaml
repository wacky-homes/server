apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
    name: actual

spec:
    podSelector:
        matchLabels:
            app: actual
    policyTypes:
        - Ingress
    ingress:
        - from:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: kube-system
                podSelector:
                    matchLabels:
                        app.kubernetes.io/name: traefik
          ports:
              - protocol: TCP
                port: 5006
