apiVersion: apps/v1
kind: Deployment

metadata:
    name: actual

spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app: actual
    template:
        metadata:
            labels:
                app: actual
        spec:
            enableServiceLinks: false
            containers:
                - name: actual
                  image: ghcr.io/actualbudget/actual:latest-alpine@sha256:67b1b5e9584e3e143b4f5c41e52b4506ed9cdd1072392d5ab5369f2d4fd0bffd
                  env:
                      - name: ACTUAL_PORT
                        value: "5006"
                  ports:
                      - name: http
                        containerPort: 5006
                  resources:
                      requests:
                          cpu: 50m
                          memory: 128Mi
                      limits:
                          memory: 512Mi
                  volumeMounts:
                      - name: data
                        mountPath: /data
            volumes:
                - name: data
                  hostPath:
                      path: /var/data/local/actual
                      type: Directory
