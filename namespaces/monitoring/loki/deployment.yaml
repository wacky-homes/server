apiVersion: apps/v1
kind: Deployment

metadata:
    name: loki

spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app: loki
    template:
        metadata:
            labels:
                app: loki
            annotations:
                prometheus.io/scrape: "true"
                prometheus.io/port: "3100"
        spec:
            enableServiceLinks: false
            containers:
                - name: loki
                  image: docker.io/grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
                  args:
                      - "-config.file=/etc/loki/loki.yaml"
                  ports:
                      - name: http
                        containerPort: 3100
                  resources:
                      requests:
                          cpu: 100m
                          memory: 256Mi
                      limits:
                          memory: 1Gi
                  readinessProbe:
                      httpGet:
                          path: /ready
                          port: http
                      initialDelaySeconds: 30
                  volumeMounts:
                      - name: loki
                        mountPath: /loki
                      - name: loki-config
                        mountPath: /etc/loki/loki.yaml
                        subPath: configuration.yaml
                        readOnly: true
            volumes:
                - name: loki
                  hostPath:
                      path: /var/data/local/loki
                      type: Directory
                - name: loki-config
                  configMap:
                      name: loki-config
