apiVersion: apps/v1
kind: Deployment

metadata:
    name: loki

spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app: loki
    template:
        metadata:
            labels:
                app: loki
            annotations:
                prometheus.io/scrape: "true"
                prometheus.io/port: "3100"
        spec:
            enableServiceLinks: false
            containers:
                - name: loki
                  image: docker.io/grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
                  args:
                      - "-config.file=/etc/loki/loki.yaml"
                  ports:
                      - name: http
                        containerPort: 3100
                  resources:
                      requests:
                          cpu: 100m
                          memory: 256Mi
                      limits:
                          memory: 1Gi
                  readinessProbe:
                      httpGet:
                          path: /ready
                          port: http
                      initialDelaySeconds: 30
                  volumeMounts:
                      - name: loki
                        mountPath: /loki
                      - name: loki-config
                        mountPath: /etc/loki/loki.yaml
                        subPath: configuration.yaml
                        readOnly: true
            volumes:
                - name: loki
                  hostPath:
                      path: /var/data/local/loki
                      type: Directory
                - name: loki-config
                  configMap:
                      name: loki-config
