apiVersion: 1

datasources:
    - name: Prometheus
      type: prometheus
      # Pinned: alerting.yaml references these uids, and Grafana would
      # otherwise generate random ones on first provision.
      uid: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true

    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki:3100
