apiVersion: apps/v1
kind: DaemonSet

metadata:
    name: alloy

spec:
    selector:
        matchLabels:
            app: alloy
    template:
        metadata:
            labels:
                app: alloy
            annotations:
                prometheus.io/scrape: "true"
                prometheus.io/port: "12345"
        spec:
            enableServiceLinks: false
            serviceAccountName: alloy
            containers:
                - name: alloy
                  image: docker.io/grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
                  args:
                      - "run"
                      - "/etc/alloy/config.alloy"
                      - "--storage.path=/var/lib/alloy"
                      - "--server.http.listen-addr=0.0.0.0:12345"
                  env:
                      - name: NODE_NAME
                        valueFrom:
                            fieldRef:
                                fieldPath: spec.nodeName
                  ports:
                      - name: http
                        containerPort: 12345
                  resources:
                      requests:
                          cpu: 50m
                          memory: 128Mi
                      limits:
                          memory: 512Mi
                  securityContext:
                      # /var/log/pods is root-owned and 0750.
                      runAsUser: 0
                  volumeMounts:
                      - name: alloy-config
                        mountPath: /etc/alloy/config.alloy
                        subPath: config.alloy
                        readOnly: true
                      - name: varlog
                        mountPath: /var/log
                        readOnly: true
                      - name: alloy-data
                        mountPath: /var/lib/alloy
            volumes:
                - name: alloy-config
                  configMap:
                      name: alloy-config
                - name: varlog
                  hostPath:
                      path: /var/log
                      type: Directory
                # Read offsets, so a restart doesn't re-ship every log.
                - name: alloy-data
                  hostPath:
                      path: /var/data/local/alloy
                      type: Directory
