global:
    scrape_interval: 15s

scrape_configs:
    - job_name: "prometheus"
      static_configs:
          - targets: ["localhost:9090"]

    # k3s apiserver: request rates/latencies, workqueue depth, etcd/kine object
    # counts, go runtime. Reached via the in-cluster Service, not the node name.
    - job_name: "k3s-apiserver"
      scheme: https
      tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      kubernetes_sd_configs:
          - role: endpoints
      relabel_configs:
          - action: keep
            regex: default;kubernetes;https
            source_labels:
                - __meta_kubernetes_namespace
                - __meta_kubernetes_service_name
                - __meta_kubernetes_endpoint_port_name

    # kubelet's own metrics: node capacity, volume stats, runtime operations,
    # pod lifecycle. Proxied through the apiserver so port 10250 stays closed.
    - job_name: "k3s-kubelet"
      scheme: https
      tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      kubernetes_sd_configs:
          - role: node
      relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics

    # cAdvisor, embedded in the kubelet: per-container CPU, memory, network
    # and filesystem. This is the one that gives you per-pod usage.
    - job_name: "k3s-cadvisor"
      scheme: https
      tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      kubernetes_sd_configs:
          - role: node
      relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

    # Anything that opts in via prometheus.io/scrape. Flux's controllers carry
    # that annotation out of the box; Loki and Alloy are annotated in this repo.
    - job_name: "kubernetes-pods"
      kubernetes_sd_configs:
          - role: pod
      relabel_configs:
          - action: keep
            regex: "true"
            source_labels:
                - __meta_kubernetes_pod_annotation_prometheus_io_scrape
          - action: replace
            regex: (.+)
            source_labels:
                - __meta_kubernetes_pod_annotation_prometheus_io_path
            target_label: __metrics_path__
          - action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            source_labels:
                - __address__
                - __meta_kubernetes_pod_annotation_prometheus_io_port
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
