apiVersion: apps/v1
kind: Deployment

metadata:
    name: prometheus

spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app: prometheus
    template:
        metadata:
            labels:
                app: prometheus
        spec:
            enableServiceLinks: false
            serviceAccountName: prometheus
            containers:
                - name: prometheus
                  image: prom/prometheus:latest
                  args:
                      - "--config.file=/etc/prometheus/prometheus.yml"
                      - "--storage.tsdb.path=/prometheus"
                      - "--storage.tsdb.retention.time=30d"
                  ports:
                      - name: http
                        containerPort: 9090
                  volumeMounts:
                      - name: prometheus
                        mountPath: /prometheus
                      - name: prometheus-config
                        mountPath: /etc/prometheus/prometheus.yml
                        subPath: configuration.yaml
                        readOnly: true
            volumes:
                - name: prometheus
                  hostPath:
                      path: /var/data/local/prometheus
                      type: Directory
                - name: prometheus-config
                  configMap:
                      name: prometheus-config
