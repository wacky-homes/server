apiVersion: apps/v1
kind: Deployment

metadata:
    name: cloudflared
    namespace: default

spec:
    replicas: 1
    selector:
        matchLabels:
            app: cloudflared
    template:
        metadata:
            labels:
                app: cloudflared
        spec:
            containers:
                - name: cloudflared
                  image: cloudflare/cloudflared:latest
                  args:
                      - tunnel
                      - --no-autoupdate
                      - --metrics
                      - 0.0.0.0:2000
                      - run
                  envFrom:
                      - secretRef:
                            name: cloudflared
                  readinessProbe:
                      httpGet:
                          path: /ready
                          port: 2000
                      initialDelaySeconds: 5
                      periodSeconds: 10
