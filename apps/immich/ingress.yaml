apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
    name: immich
    namespace: default
    annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web

spec:
    ingressClassName: traefik
    rules:
        - host: photos.wacky.homes
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: immich
                            port:
                                name: http
        - host: photos.wacky.local
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: immich
                            port:
                                name: http
