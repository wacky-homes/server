apiVersion: apps/v1
kind: Deployment

metadata:
    name: home-assistant
    namespace: default

spec:
    replicas: 1
    selector:
        matchLabels:
            app: home-assistant
    template:
        metadata:
            labels:
                app: home-assistant
        spec:
            containers:
                - name: home-assistant
                  image: ghcr.io/home-assistant/home-assistant:stable
                  ports:
                      - name: http
                        containerPort: 8123
                  volumeMounts:
                      - name: home-assistant
                        mountPath: /config
            volumes:
                - name: home-assistant
                  hostPath:
                      path: /var/data/home-assistant
                      type: DirectoryOrCreate
