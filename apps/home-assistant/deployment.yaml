apiVersion: apps/v1
kind: Deployment

metadata:
    name: home-assistant
    namespace: default

spec:
    replicas: 1
    selector:
        matchLabels:
            app: home-assistant
    template:
        metadata:
            labels:
                app: home-assistant
        spec:
            containers:
                - name: home-assistant
                  image: ghcr.io/home-assistant/home-assistant:stable
                  ports:
                      - name: http
                        containerPort: 8123
                  volumeMounts:
                      - name: home-assistant
                        mountPath: /config
                      - name: home-assistant-config
                        mountPath: /config/configuration.yaml
                        subPath: configuration.yaml
                        readOnly: true
            volumes:
                - name: home-assistant
                  hostPath:
                      path: /var/data/home-assistant
                      type: DirectoryOrCreate
                - name: home-assistant-config
                  configMap:
                      name: home-assistant-config
