apiVersion: apps/v1
kind: Deployment

metadata:
    name: hello
    namespace: default

spec:
    replicas: 2
    selector:
        matchLabels:
            app: hello
    template:
        metadata:
            labels:
                app: hello
        spec:
            containers:
                - name: hello
                  image: traefik/whoami:v1.10
                  ports:
                      - name: http
                        containerPort: 80
                  envFrom:
                      - secretRef:
                            name: hello-secrets
